name: Gerar executável

on:
  push:
    branches: [main, android]   # no branch android só compila; publicar é só no main
    paths:
      - "src/**"
      - "scripts/**"
      - "assets/**"
      - "tools/**"
      - "android/**"
      - "CMakeLists.txt"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      android:
        description: "Gerar também o APK (o foco atual é o PC)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Se algum teste falhar, nada é publicado e ninguém recebe a versão com problema.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Lua
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - name: Testes
        run: LUA_BIN=lua5.4 tests/rodar.sh 3 rapido

  windows:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Embutir scripts e fontes no .exe
        shell: bash
        run: |
          mkdir -p dist
          VERSAO="${GITHUB_SHA::7}"
          python tools/empacotar.py build/Release/TavernaDeAventureiros.exe dist/TavernaDeAventureiros.exe "$VERSAO"
          printf "%s" "$VERSAO" > dist/versao.txt

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: TavernaDeAventureiros-windows
          path: dist/

  # Android pausado: o processo continua aqui, mas só roda quando pedido à mão.
  android:
    needs: testes
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: |
          cmake -S . -B build-android -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DPLATFORM=Android -DOPENGL_VERSION="ES 3.0" \
            -DTAVERNA_PUBLICADO=${{ github.ref == 'refs/heads/main' && 'ON' || 'OFF' }}

      - name: Ajustar a raylib para OpenGL ES 3
        run: android/ajustar_raylib.sh build-android/_deps/raylib-src

      - name: Compilar
        run: cmake --build build-android --parallel

      - name: Conferir a porta de entrada do APK
        run: |
          SO="$(find build-android -name libtaverna.so | head -1)"
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "$SO" | grep -q ANativeActivity_onCreate

      - name: Montar o APK
        run: |
          mkdir -p dist
          VERSAO="${GITHUB_SHA::7}"
          python tools/empacotar.py - dist/pacote-m1.bin "$VERSAO"
          android/gerar_apk.sh "$(find build-android -name libtaverna.so | head -1)" dist/pacote-m1.bin dist/TavernaDeAventureiros.apk

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: TavernaDeAventureiros-android
          path: dist/

  publicar:
    needs: [windows, android]
    if: always() && github.ref == 'refs/heads/main' && needs.windows.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Atualiza só os arquivos novos: o último APK continua disponível na versão de teste.
      - name: Publicar versão de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view teste > /dev/null 2>&1 || gh release create teste --prerelease --title "Versão de teste" --notes "Versão de teste" --target "$GITHUB_SHA"
          gh release upload teste \
            dist/TavernaDeAventureiros-windows/TavernaDeAventureiros.exe \
            dist/TavernaDeAventureiros-windows/versao.txt \
            --clobber
          if [ -d dist/TavernaDeAventureiros-android ]; then
            gh release upload teste \
              dist/TavernaDeAventureiros-android/TavernaDeAventureiros.apk \
              dist/TavernaDeAventureiros-android/pacote-m1.bin \
              --clobber
          fi
          gh release edit teste --notes "Commit ${GITHUB_SHA::7}. No computador, baixe o TavernaDeAventureiros.exe, que se atualiza sozinho ao abrir. O APK é de uma versão anterior: o foco atual é o PC."
