name: Gerar executável

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "assets/**"
      - "tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Embutir scripts e fontes no .exe
        shell: bash
        run: |
          mkdir -p dist
          VERSAO="${GITHUB_SHA::7}"
          python tools/empacotar.py build/Release/TavernaDeAventureiros.exe dist/TavernaDeAventureiros.exe "$VERSAO"
          printf "%s" "$VERSAO" > dist/versao.txt

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: TavernaDeAventureiros-windows
          path: dist/

      - name: Publicar versão de teste
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teste --yes --cleanup-tag || true
          gh release create teste dist/TavernaDeAventureiros.exe dist/versao.txt \
            --prerelease \
            --title "Versão de teste" \
            --notes "Gerada automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe só o TavernaDeAventureiros.exe: ele se atualiza sozinho ao abrir." \
            --target "$GITHUB_SHA"
