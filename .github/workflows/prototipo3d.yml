name: Protótipo 3D

# Publica um zip na versão "prototipo-3d". O atualizador do jogo só olha a versão "teste",
# então isto não atualiza o jogo de ninguém.
on:
  push:
    branches: [prototipo-3d]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -A x64
      - name: Compilar
        run: cmake --build build --config Release
      - name: Montar pasta
        shell: bash
        run: |
          mkdir -p dist
          cp build/Release/TavernaDeAventureiros.exe dist/
          cp -r scripts assets dist/
      - name: Publicar zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist TavernaPrototipo3D
          7z a TavernaPrototipo3D.zip TavernaPrototipo3D
          gh release delete prototipo-3d --yes --cleanup-tag || true
          gh release create prototipo-3d TavernaPrototipo3D.zip \
            --prerelease --latest=false \
            --title "Protótipo 3D (só para avaliar)" \
            --notes "Extraia o zip e abra o .exe de dentro da pasta. Não usa o progresso salvo e não se atualiza." \
            --target "$GITHUB_SHA"
