name: Jogo 3D (versão de avaliação)

# Publica um zip na versão "jogo-3d-teste". O atualizador do jogo só olha a versão "teste",
# então isto não atualiza o jogo de ninguém.
on:
  push:
    branches: [jogo-3d]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -A x64
      - name: Compilar
        run: cmake --build build --config Release
      - name: Montar pasta
        shell: bash
        run: |
          mkdir -p dist
          cp build/Release/TavernaDeAventureiros.exe dist/
          cp -r scripts assets dist/
      - name: Publicar zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist TavernaDeAventureiros3D
          7z a TavernaDeAventureiros3D.zip TavernaDeAventureiros3D
          gh release delete jogo-3d-teste --yes --cleanup-tag || true
          gh release create jogo-3d-teste TavernaDeAventureiros3D.zip \
            --prerelease --latest=false \
            --title "Jogo 3D (só para avaliar)" \
            --notes "Extraia o zip e abra o .exe de dentro da pasta. Tem progresso próprio, separado do jogo 2D, e não se atualiza sozinho." \
            --target "$GITHUB_SHA"
